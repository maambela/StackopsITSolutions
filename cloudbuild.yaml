# cloudbuild.yaml
steps:
  # 1. Build the Docker image and tag it using the commit SHA
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t',
      'us-central1-docker.pkg.dev/stackops-backend-475222/stackops-repo/stackops-app:$COMMIT_SHA',
      '.'
    ]

  # 2. Push the newly tagged image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'us-central1-docker.pkg.dev/stackops-backend-475222/stackops-repo/stackops-app:$COMMIT_SHA'
    ]

  # 3. Deploy the new image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run',
      'deploy',
      'stackops-backend',
      '--image', 'us-central1-docker.pkg.dev/stackops-backend-475222/stackops-repo/stackops-app:$COMMIT_SHA',
      '--region', 'us-central1',
      '--platform', 'managed',
      '--memory', '2Gi',
      '--cpu', '1',
      '--min-instances', '0',
      '--cpu-throttling',
      '--timeout', '3600',
      '--set-cloudsql-instances', 'stackops-backend-475222:us-central1:stackops-db',
      '--update-env-vars', 'CLOUD_SQL_CONNECTION_NAME=stackops-backend-475222:us-central1:stackops-db,DB_NAME=consultation_db,NODE_OPTIONS=--trace-uncaught --trace-warnings,ENTERPRISE_AI_AUTOMATION_ENABLED=false,SECURITY_FINDING_AI_ENABLED=false',
      # Remove legacy literal values before replacing them with Secret Manager
      # references in this same revision. Cloud Run rejects an in-place type change.
      '--remove-env-vars', 'DB_USER,DB_PASSWORD,AZURE_TENANT_ID,AZURE_CLIENT_ID,AZURE_CLIENT_SECRET,MICROSOFT_TENANT_ID,MICROSOFT_CLIENT_ID,MICROSOFT_CLIENT_SECRET,CLOUDFLARE_ACCOUNT_ID,CLOUDFLARE_API_TOKEN,STACKCTRL_AUTOMATION_TRIGGER_SECRET',
      '--update-secrets', 'DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,AZURE_TENANT_ID=AZURE_TENANT_ID:latest,AZURE_CLIENT_ID=AZURE_CLIENT_ID:latest,AZURE_CLIENT_SECRET=AZURE_CLIENT_SECRET:latest,MICROSOFT_TENANT_ID=MICROSOFT_TENANT_ID:latest,MICROSOFT_CLIENT_ID=MICROSOFT_CLIENT_ID:latest,MICROSOFT_CLIENT_SECRET=MICROSOFT_CLIENT_SECRET:latest,CLOUDFLARE_ACCOUNT_ID=CLOUDFLARE_ACCOUNT_ID:latest,CLOUDFLARE_API_TOKEN=CLOUDFLARE_API_TOKEN:latest,ENTRA_PORTAL_TENANT_ID=ENTRA_PORTAL_TENANT_ID:latest,ENTRA_PORTAL_CLIENT_ID=ENTRA_PORTAL_CLIENT_ID:latest,ENTRA_PORTAL_CLIENT_SECRET=ENTRA_PORTAL_CLIENT_SECRET:latest,ENTRA_PORTAL_REDIRECT_URI=ENTRA_PORTAL_REDIRECT_URI:latest,STACKCTRL_AUTOMATION_TRIGGER_SECRET=STACKCTRL_AUTOMATION_TRIGGER_SECRET:latest',
      # The backend now reads Azure AI secrets directly from Google Secret Manager.
      # Remove the deleted legacy secret mapping from the Cloud Run revision.
      '--remove-secrets', 'OPENAI_API_KEY',
      '--allow-unauthenticated',
      '--quiet'
    ]

timeout: '1600s'

images:
  - 'us-central1-docker.pkg.dev/stackops-backend-475222/stackops-repo/stackops-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
